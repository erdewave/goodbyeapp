# Builds and launch-tests the macOS and Linux packages, then attaches them to a release.
# Windows is built by hand, so it is not in the matrix.
name: Packages

on:
  push:
    tags: ['v*']
    branches: [ci-matrix]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the packages to. Empty only keeps them as workflow artifacts.
        required: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, exe: 'release/linux-unpacked/goodbyeapp', files: 'release/*.AppImage' }
          - { name: mac-arm64, os: macos-latest, exe: 'release/mac-arm64/GoodbyeAPP.app/Contents/MacOS/GoodbyeAPP', files: 'release/*.dmg' }
          - { name: mac-x64, os: macos-15-intel, exe: 'release/mac/GoodbyeAPP.app/Contents/MacOS/GoodbyeAPP', files: 'release/*.dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Xvfb
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm test
      # .deb needs an author email in package.json, so Linux ships the AppImage only for now.
      # hdiutil sometimes fails to eject the disk image on macOS runners, so building is retried.
      - name: Package
        shell: bash
        run: |
          npm run build
          for attempt in 1 2 3; do
            npx electron-builder --publish never ${{ matrix.name == 'linux' && '-c.linux.target=AppImage' || '' }} && exit 0
            sleep 10
          done
          exit 1
      - name: Launch the packaged app
        shell: bash
        run: |
          ls release
          export GOODBYEAPP_EXECUTABLE="$PWD/${{ matrix.exe }}"
          if [ "${{ matrix.name }}" = linux ]; then xvfb-run -a npm run test:launch; else npm run test:launch; fi
      - name: App output and crash reports
        if: failure() && startsWith(matrix.name, 'mac')
        shell: bash
        run: |
          EXE=$(ls "$PWD/${{ matrix.exe }}")
          ( "$EXE" --no-sandbox & pid=$!; sleep 15; kill $pid ) 2>&1 | head -60 || true
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/* 2>/dev/null | head -2); do echo "== $f"; head -c 4000 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            artifacts/*.png
          if-no-files-found: warn
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
