# Builds and launch-tests the macOS and Linux packages, then attaches them to a release.
# Windows is built by hand, so it is not in the matrix.
name: Packages

on:
  push:
    tags: ['v*']
    branches: [ci-matrix]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the packages to. Empty only keeps them as workflow artifacts.
        required: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, os: ubuntu-latest, exe: 'release/linux-unpacked/goodbyeapp', files: 'release/*.AppImage release/*.deb' }
          - { name: mac-arm64, os: macos-latest, exe: 'release/mac-arm64/GoodbyeAPP.app/Contents/MacOS/GoodbyeAPP', files: 'release/*.dmg' }
          - { name: mac-x64, os: macos-15-intel, exe: 'release/mac/GoodbyeAPP.app/Contents/MacOS/GoodbyeAPP', files: 'release/*.dmg' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Xvfb
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm test
      - run: npm run dist -- --publish never
      - name: Launch the packaged app
        shell: bash
        run: |
          ls release
          export GOODBYEAPP_EXECUTABLE="$PWD/${{ matrix.exe }}"
          if [ "${{ matrix.name }}" = linux ]; then xvfb-run -a npm run test:launch; else npm run test:launch; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            artifacts/*.png
          if-no-files-found: warn
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
