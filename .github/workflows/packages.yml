# Tests, builds and launch-checks the Windows, macOS and Linux packages, then attaches them to a release together with
# latest.json, which installed copies read to update themselves (the signature comes from the TAURI_SIGNING_PRIVATE_KEY secret).
name: Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the packages to. Empty only checks that everything builds.
        required: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, exe: 'src-tauri/target/release/goodbyeapp.exe', bundles: nsis }
          - { name: linux, os: ubuntu-latest, exe: 'src-tauri/target/release/goodbyeapp', bundles: appimage }
          - { name: mac-arm64, os: macos-latest, exe: 'src-tauri/target/release/goodbyeapp', bundles: dmg }
          - { name: mac-x64, os: macos-15-intel, exe: 'src-tauri/target/release/goodbyeapp', bundles: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf xvfb
      - run: npm ci
      - run: npm test
      # macOS gets an ad-hoc signature: Apple Silicon will not run a bundle with none. tauri-action also uploads latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          releaseDraft: false
          args: --bundles ${{ matrix.bundles }}
      # Copies of the Electron build (0.3.2 and earlier) only read electron-updater's latest.yml / latest-linux.yml, so those
      # point at the new installer too; its hook (src-tauri/windows/hooks.nsh) then removes the old Electron copy.
      - name: Electron update feed
        if: matrix.name == 'windows' || matrix.name == 'linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          cd src-tauri/target/release
          version=$(node -p "require('../../../package.json').version")
          if [ "${{ matrix.name }}" = windows ]; then file=$(ls bundle/nsis/*-setup.exe) feed=latest.yml; else file=$(ls bundle/appimage/*.AppImage) feed=latest-linux.yml; fi
          node -e '
            const fs = require("fs"), [file, feed, version] = process.argv.slice(1), data = fs.readFileSync(file);
            const sha512 = require("crypto").createHash("sha512").update(data).digest("base64"), name = require("path").basename(file);
            fs.writeFileSync(feed, `version: ${version}\nfiles:\n  - url: ${name}\n    sha512: ${sha512}\n    size: ${data.length}\npath: ${name}\nsha512: ${sha512}\nreleaseDate: "${new Date().toISOString()}"\n`);
          ' "$file" "$feed" "$version"
          cat "$feed"
          if [ -n "$TAG" ]; then gh release upload "$TAG" "$feed" --clobber; fi
      # The check itself takes seconds; a hung quit on a flaky runner would otherwise hold the job for hours.
      - name: Launch the built app
        timeout-minutes: 5
        shell: bash
        run: |
          export GOODBYEAPP_EXECUTABLE="$PWD/${{ matrix.exe }}"
          if [ "${{ matrix.name }}" = linux ]; then xvfb-run -a npm run test:launch; else npm run test:launch; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/latest*.yml
          if-no-files-found: warn
